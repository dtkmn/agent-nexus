services:
  postgres:
    image: postgres:17
    container_name: agent-nexus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quarkus}
      POSTGRES_USER: ${POSTGRES_USER:-quarkus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarkus}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-nexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: dtkmn/agent-nexus:latest
    container_name: agent-nexus-app
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_JDBC_URL: jdbc:postgresql://agent-nexus-postgres:5432/${POSTGRES_DB:-quarkus}
      DB_USERNAME: ${POSTGRES_USER:-quarkus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-quarkus}
      A2A_AGENT_DESCRIPTION: ${A2A_AGENT_DESCRIPTION:-Orchestrates customer support requests by classifying intent, delegating to billing/technical specialists, and returning one consolidated response.}
      DEMO_SUPPORT_ORCHESTRATOR_ENABLED_TOOLS: ${DEMO_SUPPORT_ORCHESTRATOR_ENABLED_TOOLS:-}
      AGENT_MCP_BASE_URL: ${AGENT_MCP_BASE_URL:-}
      AGENT_MCP_AUTH_TOKEN: ${AGENT_MCP_AUTH_TOKEN:-}
      AGENT_MCP_READ_TIMEOUT_SECONDS: ${AGENT_MCP_READ_TIMEOUT_SECONDS:-20}
      AGENT_MCP_MAX_TOOLS_PER_REQUEST: ${AGENT_MCP_MAX_TOOLS_PER_REQUEST:-2}
      AGENT_MCP_PROTOCOL_VERSION: ${AGENT_MCP_PROTOCOL_VERSION:-2025-11-25}
      AGENT_MCP_CLIENT_NAME: ${AGENT_MCP_CLIENT_NAME:-agent-nexus}
      AGENT_MCP_CLIENT_VERSION: ${AGENT_MCP_CLIENT_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - a2a-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  a2a-network:
    driver: bridge
